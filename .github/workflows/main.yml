name: Build Tachistoscop APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "Tachistoscop_Android_Project_v0.1.zip" -d extracted

      - name: Find project
        run: |
          SETTINGS="$(find extracted -type f -name "settings.gradle.kts" | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Tachistoscop-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
